<svg width="1200" height="980" viewBox="0 0 1200 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DataCanvas Paper Reproduce 项目核心流程</title>
  <desc id="desc">从论文或 GitHub 仓库输入，到预检、解析审计、后端确认、代码与资产准备、实验执行、结果验证，最终产出报告的复现流程图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F8FF"/>
      <stop offset="0.52" stop-color="#F9FCFF"/>
      <stop offset="1" stop-color="#F4FFF8"/>
    </linearGradient>
    <linearGradient id="hero" x1="140" y1="70" x2="1060" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#315CFF"/>
      <stop offset="1" stop-color="#00A870"/>
    </linearGradient>
    <linearGradient id="input" x1="90" y1="280" x2="350" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D7CFF"/>
      <stop offset="1" stop-color="#4C63E6"/>
    </linearGradient>
    <linearGradient id="agent" x1="470" y1="270" x2="730" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00B894"/>
      <stop offset="1" stop-color="#00966F"/>
    </linearGradient>
    <linearGradient id="output" x1="850" y1="280" x2="1110" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB020"/>
      <stop offset="1" stop-color="#F06A3D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1B2A4A" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B2A4A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10V2Z" fill="#7A869A"/>
    </marker>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 800; letter-spacing: 0.3px; fill: #FFFFFF; }
      .subtitle { font-size: 18px; font-weight: 500; fill: rgba(255,255,255,0.86); }
      .section-title { font-size: 19px; font-weight: 800; fill: #172B4D; }
      .card-title { font-size: 21px; font-weight: 800; fill: #172B4D; }
      .card-text { font-size: 15px; font-weight: 500; fill: #52627A; }
      .white-title { font-size: 21px; font-weight: 800; fill: #FFFFFF; }
      .white-text { font-size: 15px; font-weight: 500; fill: rgba(255,255,255,0.88); }
      .num { font-size: 16px; font-weight: 800; fill: #FFFFFF; }
      .pill { font-size: 13px; font-weight: 700; fill: #52627A; }
      .footer { font-size: 15px; font-weight: 700; fill: #6B778C; }
    </style>
  </defs>

  <rect width="1200" height="980" rx="32" fill="url(#bg)"/>
  <circle cx="105" cy="125" r="78" fill="#315CFF" opacity="0.08"/>
  <circle cx="1070" cy="840" r="118" fill="#00A870" opacity="0.08"/>
  <circle cx="1010" cy="150" r="60" fill="#FFB020" opacity="0.10"/>

  <rect x="120" y="70" width="960" height="145" rx="30" fill="url(#hero)" filter="url(#shadow)"/>
  <text class="font title" x="600" y="126" text-anchor="middle">DataCanvas Paper Reproduce</text>
  <text class="font subtitle" x="600" y="166" text-anchor="middle">标准化论文 / GitHub 项目复现工作流</text>

  <path d="M220 440C220 515 600 505 600 570" stroke="#A8B3C5" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 12" marker-end="url(#arrow)"/>
  <path d="M600 440V570" stroke="#A8B3C5" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 12" marker-end="url(#arrow)"/>
  <path d="M980 440C980 515 600 505 600 570" stroke="#A8B3C5" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 12" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="90" y="285" width="260" height="155" rx="26" fill="url(#input)"/>
    <circle cx="127" cy="323" r="19" fill="rgba(255,255,255,0.22)"/>
    <text class="font num" x="127" y="329" text-anchor="middle">1</text>
    <text class="font white-title" x="155" y="328">输入任务</text>
    <text class="font white-text" x="120" y="370">论文 PDF / arXiv 链接</text>
    <text class="font white-text" x="120" y="398">GitHub 仓库与用户目标</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="470" y="285" width="260" height="155" rx="26" fill="url(#agent)"/>
    <circle cx="507" cy="323" r="19" fill="rgba(255,255,255,0.22)"/>
    <text class="font num" x="507" y="329" text-anchor="middle">2</text>
    <text class="font white-title" x="535" y="328">智能体入口</text>
    <text class="font white-text" x="500" y="370">调用 $datacanvas-paper-reproduce</text>
    <text class="font white-text" x="500" y="398">编排 ar24-* 专项 Skill</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="850" y="285" width="260" height="155" rx="26" fill="url(#output)"/>
    <circle cx="887" cy="323" r="19" fill="rgba(255,255,255,0.22)"/>
    <text class="font num" x="887" y="329" text-anchor="middle">3</text>
    <text class="font white-title" x="915" y="328">安全门禁</text>
    <text class="font white-text" x="880" y="370">后端与费用需明确确认</text>
    <text class="font white-text" x="880" y="398">敏感凭据不写入仓库</text>
  </g>

  <rect x="95" y="570" width="1010" height="260" rx="32" fill="#FFFFFF" filter="url(#shadow)"/>
  <text class="font section-title" x="135" y="615">复现执行闭环</text>

  <g>
    <rect x="135" y="650" width="170" height="118" rx="22" fill="#F1F5FF" stroke="#D9E2FF" stroke-width="2"/>
    <circle cx="164" cy="679" r="17" fill="#315CFF"/>
    <text class="font num" x="164" y="685" text-anchor="middle">4</text>
    <text class="font card-title" x="135" y="718">公共预检</text>
    <text class="font card-text" x="135" y="746">检查已知复现资源</text>
  </g>
  <path d="M315 709H365" stroke="#7A869A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g>
    <rect x="375" y="650" width="170" height="118" rx="22" fill="#F0FFF9" stroke="#C6F2E4" stroke-width="2"/>
    <circle cx="404" cy="679" r="17" fill="#00A870"/>
    <text class="font num" x="404" y="685" text-anchor="middle">5</text>
    <text class="font card-title" x="375" y="718">解析审计</text>
    <text class="font card-text" x="375" y="746">论文、README、代码</text>
  </g>
  <path d="M555 709H605" stroke="#7A869A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g>
    <rect x="615" y="650" width="170" height="118" rx="22" fill="#FFF8EA" stroke="#FFE2A8" stroke-width="2"/>
    <circle cx="644" cy="679" r="17" fill="#FF9F1A"/>
    <text class="font num" x="644" y="685" text-anchor="middle">6</text>
    <text class="font card-title" x="615" y="718">后端确认</text>
    <text class="font card-text" x="615" y="746">local / ssh / cci</text>
  </g>
  <path d="M795 709H845" stroke="#7A869A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g>
    <rect x="855" y="650" width="210" height="118" rx="22" fill="#FFF2F0" stroke="#FFD2CC" stroke-width="2"/>
    <circle cx="884" cy="679" r="17" fill="#FF5A52"/>
    <text class="font num" x="884" y="685" text-anchor="middle">7</text>
    <text class="font card-title" x="855" y="718">准备与执行</text>
    <text class="font card-text" x="855" y="746">代码、依赖、数据、权重、实验</text>
  </g>

  <path d="M960 778C960 820 795 850 705 850" stroke="#7A869A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="135" y="855" width="930" height="78" rx="24" fill="#172B4D"/>
    <circle cx="177" cy="894" r="20" fill="rgba(255,255,255,0.18)"/>
    <text class="font num" x="177" y="900" text-anchor="middle">8</text>
    <text class="font white-title" x="215" y="888">验证与交付</text>
    <text class="font white-text" x="215" y="915">结果验证 · 图表复现 · 执行台账 · 用户确认后生成 Word 报告 · 输出审计报告与实验产物</text>
  </g>

  <g>
    <rect x="135" y="235" width="148" height="34" rx="17" fill="#EAF0FF"/>
    <text class="font pill" x="209" y="257" text-anchor="middle">输入清晰</text>
    <rect x="305" y="235" width="148" height="34" rx="17" fill="#E8FFF5"/>
    <text class="font pill" x="379" y="257" text-anchor="middle">步骤可追踪</text>
    <rect x="475" y="235" width="148" height="34" rx="17" fill="#FFF7E6"/>
    <text class="font pill" x="549" y="257" text-anchor="middle">成本需确认</text>
    <rect x="645" y="235" width="148" height="34" rx="17" fill="#FFF0F0"/>
    <text class="font pill" x="719" y="257" text-anchor="middle">结果可验证</text>
    <rect x="815" y="235" width="148" height="34" rx="17" fill="#F0F3F7"/>
    <text class="font pill" x="889" y="257" text-anchor="middle">报告可交付</text>
  </g>
</svg>
